# CD for the released app (TestFlight / App Store). Runs only after a merge (a push to main),
# never on PR events.
# Ship every push to main:
#   test -> fingerprint -> is there already a production (store) iOS build with this native fingerprint?
#     yes -> JS-only change: publish an OTA update to the "production" channel
#     no  -> native change: ONE new iOS production (store) build, then `submit` it to App Store Connect / TestFlight
# Only one build per native change: the ad hoc "preview" build is no longer made here
# (TestFlight can't take an ad hoc build). `eas build --profile preview` still works by hand.
# Pattern from https://docs.expo.dev/eas/workflows/examples/deploy-to-production/
#
# The upload uses (one-time setup, done; see CONTRIBUTING.md section 8):
#   * the App Store Connect app record "Rep Royale: Push-up Battles", Apple ID 6829467517,
#     as submit.production.ios.ascAppId in eas.json
#   * the App Store Connect API key (team key, App Manager) stored in EAS credentials and assigned
#     to this project for EAS Submit (eas credentials -p ios -> App Store Connect). No key is in the repo.
# If the upload fails, the build is kept: `eas submit -p ios --id <build id>` retries without a new build.
name: Deploy production

on:
  push:
    branches: ['main']

concurrency:
  group: deploy-production-${{ github.ref }}

jobs:
  test:
    name: Jest + TypeScript
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Unit tests
        run: npx jest --ci
      - name: Type check
        run: npx tsc --noEmit

  fingerprint:
    name: Fingerprint
    needs: [test]
    type: fingerprint
    environment: production # same environment as the "production" build profile

  get_ios_build:
    name: Check for a compatible iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: Build iOS for the App Store (native change)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    # EAS Submit (`type: submit`), the workflow form of `eas submit -p ios`. Uploads the store
    # build to App Store Connect, where it shows up in TestFlight after Apple processes it.
    # (The `testflight` job type, which can also set groups/changelog, needs a paid Expo plan.)
    name: Upload to App Store Connect / TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  publish_ios_update:
    name: Publish OTA update (JS-only change)
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      channel: production
      platform: ios

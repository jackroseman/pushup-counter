# CD for the released app (TestFlight / App Store). Runs only after a merge (a push to main),
# never on PR events.
# Ship every push to main:
#   test -> fingerprint -> is there already a production (store) iOS build with this native fingerprint?
#     yes -> JS-only change: publish an OTA update to the "production" channel
#     no  -> native change: ONE new iOS production (store) build, then upload it to TestFlight
# Only one build per native change: the ad hoc "preview" build is no longer made here
# (TestFlight can't take an ad hoc build). `eas build --profile preview` still works by hand.
# Pattern from https://docs.expo.dev/eas/workflows/examples/deploy-to-production/
#
# The TestFlight upload needs, once (see CONTRIBUTING.md section 8):
#   * the app record in App Store Connect and its Apple ID as submit.production.ios.ascAppId in eas.json
#   * an App Store Connect API key assigned to the app in EAS credentials (eas credentials -p ios)
# If the upload fails, the build is kept: `eas submit -p ios --id <build id>` retries without a new build.
name: Deploy production

on:
  push:
    branches: ['main']

concurrency:
  group: deploy-production-${{ github.ref }}

jobs:
  test:
    name: Jest + TypeScript
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Unit tests
        run: npx jest --ci
      - name: Type check
        run: npx tsc --noEmit

  fingerprint:
    name: Fingerprint
    needs: [test]
    type: fingerprint
    environment: production # same environment as the "production" build profile

  get_ios_build:
    name: Check for a compatible iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: Build iOS for the App Store (native change)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  testflight_ios:
    name: Upload to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  publish_ios_update:
    name: Publish OTA update (JS-only change)
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      channel: production
      platform: ios

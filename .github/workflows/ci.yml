# CI: runs on every commit pushed to a PR into main/dev, and on pushes to dev (after a
# merge). Feature branches get CI through their PR only, so a push is not checked twice. The "checks" job is the REQUIRED status check in branch protection: keep its
# name stable (renaming it means updating the protection rules).
# Deploys are NOT done here: eas-ship.yml ships the app (OTA, or an EAS build for a native
# change) and supabase-deploy.yml applies database migrations, both after a merge.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 0 errors allowed. The 26 warnings are React Compiler diagnostics (see eslint.config.js);
      # the cap only goes down: lower it when you fix some, never raise it.
      - name: Lint (expo lint)
        run: npm run lint -- --max-warnings 26

      - name: Unit tests (jest)
        run: npx jest --ci

      - name: Database tests (PGlite, supabase/migrations)
        run: npm run test:db

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Bundle smoke test (expo export, iOS)
        run: npx expo export --platform ios --output-dir ${{ runner.temp }}/expo-export

  doctor:
    # Advisory only (talks to the network, can be flaky): not a required check.
    name: expo-doctor (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor

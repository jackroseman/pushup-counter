# CI: runs on every commit pushed to a PR into main/dev, and on pushes to dev or main
# (after a merge). Feature branches get CI through their PR only, so a push is not checked
# twice. The "checks" job is the REQUIRED status check in branch protection: keep its
# name stable (renaming it means updating the protection rules).
#
# Deploys of the app are gated here: after checks pass on a push to dev or main, and only
# if the commit changed something other than docs, tests, supabase/, .github/ or tools/, the
# "ship" job starts eas-ship.yml for this exact SHA. That is what publishes an OTA or
# starts a native build. eas-ship.yml is no longer triggered by push alone, so a red
# checks run cannot reach a phone. supabase-deploy.yml stays a separate push workflow.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  # Cancel superseded checks on a PR. Do not cancel a push run: its ship job may already
  # be publishing, and a docs-only follow-up must not abort that.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 0 errors allowed. The 16 warnings are React Compiler diagnostics (see eslint.config.js);
      # the cap only goes down: lower it when you fix some, never raise it.
      - name: Lint (expo lint)
        run: npm run lint -- --max-warnings 16

      - name: Unit tests (jest)
        run: npx jest --ci

      - name: Database tests (PGlite, supabase/migrations)
        run: npm run test:db

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Bundle smoke test (expo export, iOS)
        run: npx expo export --platform ios --output-dir ${{ runner.temp }}/expo-export

  doctor:
    # Advisory only (talks to the network, can be flaky): not a required check.
    name: expo-doctor (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor

  # Parallel with checks. Decides whether this push should start eas-ship.yml (same
  # ignore list as the old eas-ship paths-ignore, plus .github/ so a workflow-only
  # merge cannot publish an OTA or start a build, plus tools/: developer tooling such as
  # the web preview, which has its own package.json and is never bundled into the app).
  should-ship:
    name: should-ship
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ship: ${{ steps.filter.outputs.ship }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the first parent of merge commits for git diff HEAD^.
          fetch-depth: 0

      - name: Detect shippable path changes
        id: filter
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "Could not find a parent commit; treating as shippable."
            echo "ship=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Use :(exclude) / glob, not :!__tests__: git parses '_' after :! as pathspec magic.
          changed="$(git diff --name-only HEAD^ HEAD -- \
            ':(exclude,glob)**/*.md' \
            ':(exclude)docs/**' \
            ':(exclude)__tests__/**' \
            ':(exclude)supabase/**' \
            ':(exclude).github/**' \
            ':(exclude)tools/**')"
          if [ -z "$changed" ]; then
            echo "No shippable paths changed; eas-ship will not run."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "Shippable paths changed:"
            printf '%s\n' "$changed"
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi

  ship:
    name: ship (${{ github.ref_name == 'main' && 'production' || 'development' }})
    needs: [checks, should-ship]
    if: >
      github.event_name == 'push' &&
      (github.ref_name == 'dev' || github.ref_name == 'main') &&
      needs.checks.result == 'success' &&
      needs.should-ship.outputs.ship == 'true'
    uses: ./.github/workflows/eas-ship.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      checks: read
